[main]
include=balanced

[cpu]
# schedutil with a balanced EPP: good responsiveness, low idle power.
governor=schedutil
energy_performance_preference=balance_performance
load_threshold=15

[power]
# Let the runtime PM of USB/PCIe devices do the work; msr1-power.service
# additionally applies the MS-R1 specific settings.
pm_type=auto

[network]
# Wake on LAN is useful for a headless workstation.
wake_on_lan=0
