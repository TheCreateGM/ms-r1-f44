# MINISFORUM MS-R1 (CIX CP8180 / Sky1) module blacklists.
#
# The Sky1 kernel patch set brings its own CIX USB/PHY controllers which
# register as platform devices; these do not need to be autoloaded by
# alias.  Nothing is blacklisted here on purpose - the MS-R1 USB stack works
# through the ACPI-described xHCI controllers and the CIX DWC3 drivers load
# from their own modaliases.

# Keep the console on the PL011 UART: never let a serial driver grab it
# early and print before the console is set up.
options ttyAMA0 keep_unused
