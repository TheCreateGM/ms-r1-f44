# MINISFORUM MS-R1 power configuration
# Read by /usr/libexec/ms-r1/msr1-power-apply (msr1-power.service).
# Values are validated against the values the running kernel actually offers;
# unsupported values are ignored rather than failing the service.

# cpufreq policy.  schedutil is the Fedora default and reacts to CPU pressure
# without the latency spikes of the ondemand governor.
MSR1_CPU_GOVERNOR="schedutil"
# ACPI CPPC energy performance preference.
#   balance_performance - the safe desktop default (used by tuned/Fedora)
#   balance_power       - more aggressive idle down-clocking, ~5-10% lower idle
#                         power, slightly more wake latency.  Set this if the
#                         MS-R1 runs hot or idle.
MSR1_EPP="balance_performance"

# NVMe APST exit latency tolerance in microseconds.  The kernel default is
# 100000 (100 ms); 2000 us keeps the drive responsive while allowing deeper
# power states on an idle desktop.
MSR1_NVME_APST_EXIT_LATENCY="2000"

# PCIe ASPM policy.  Leave empty to use the kernel command line default.
# The MS-R1 is validated with pcie_aspm=off; set to "powersave" only if you
# boot with the "MS-R1 (low power)" menu entry and observe a stable link.
MSR1_PCIE_ASPM_POLICY=""

# Set to 1 to also print policy messages to the console.
MSR1_LOG_VERBOSE="0"
