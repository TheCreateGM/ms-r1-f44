# dracut configuration for the MINISFORUM MS-R1 (CIX CP8180 / Sky1) kernel
# 6.19.10-300.fc44.msr1.  Used when the live image installs to disk: the
# initramfs that anaconda/dracut generates on the MS-R1 must be able to reach
# the CIX boot media and the NPU.
#
# Only add-on modules are requested here; storage/USB/network modules are
# detected by dracut's hostonly pass on the real machine, which is more
# reliable than a hard coded list.

# CIX Sky1 platform + NPU
add_modules+=" armchina_npu "
hostonly_no_check="/etc/crypttab"
omit_drivers=""

# The MS-R1 has no legacy IDE/SATA and no floppy; keep the initramfs small and
# avoid probing for controllers that are not present.
omit_modules+=" floppy "

# Preserve the modprobe.alias/modprobe.blacklist files the image ships.
install_items+=" /etc/modprobe.d/99-msr1-blacklist.conf "

# NPU firmware/UMD helper library and the ACPI override source are kept on the
# installed system for troubleshooting (the AML itself is compiled into the
# shipped initramfs by this image's build).
install_items+=" /usr/share/doc/ms-r1/NPU.md "
